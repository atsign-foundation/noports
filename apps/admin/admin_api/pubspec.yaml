name: admin_api
description: NoPorts admin API server
version: 1.1.0
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.4.3

# Add regular dependencies here.
dependencies:
  alfred: 1.1.2+1
  at_client: ^4.0.0
