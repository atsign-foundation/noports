name: unit_tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - trunk

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cli_tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite/verify_cli_tags
  tls_verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite/verify_tls_verification
  sshnoports-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: dart pub get enforce lockfile
        working-directory: packages/dart/sshnoports
        run: dart pub get --enforce-lockfile
      - name: dart analyze
        working-directory: packages/dart/sshnoports
        run: dart analyze
      - name: dart test
        working-directory: packages/dart/sshnoports
        run: dart test
      - name: compile atsc and srv, and check --help through each old name
        working-directory: packages/dart/sshnoports
        run: |
          dart run build_runner build --delete-conflicting-outputs
          mkdir -p "$RUNNER_TEMP/bin"
          dart compile exe bin/atsc.dart -o "$RUNNER_TEMP/bin/atsc"
          dart compile exe bin/srv.dart -o "$RUNNER_TEMP/bin/srv"
          find launchers -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/bin/" \;
          "$RUNNER_TEMP/bin/atsc" --help > /dev/null
          "$RUNNER_TEMP/bin/srv" --help > /dev/null
          # NOTE: keep this list in step with _commands in bin/atsc.dart
          for b in at_activate noports np_admin npevents npp npp_atserver npp_file npt srvd sshnp sshnpd; do
            echo "$b"
            "$RUNNER_TEMP/bin/$b" --help > /dev/null
          done
      # Runs osv-scanner to find any vulnerable Dart dependencies
      # It needs to look at pubspec.lock files, which is why it's
      # placed here, as the `dart pub get` above will create them
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=./packages/dart/sshnoports/pubspec.lock

  npe2e-unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NOTE the banner check's IPv4 case runs on macOS alone; Linux skips it
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: dart pub get enforce lockfile
        working-directory: tests/npe2e
        run: dart pub get --enforce-lockfile
      - name: dart analyze
        working-directory: tests/npe2e
        run: dart analyze
      - name: dart test
        working-directory: tests/npe2e
        run: dart test

  csharp-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Windows launcher tests
        working-directory: packages/csharp/AtscLauncher/test
        run: dotnet test
      - name: Windows service tests
        working-directory: packages/csharp/WindowsBinaryService.Tests
        run: dotnet test

  noports_core-unit_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-channel: [stable,beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.dart-channel}}
      - name: dart pub get
        working-directory: packages/dart/noports_core
        run: dart pub get
      - name: dart run build_runner build
        working-directory: packages/dart/noports_core
        run: dart run build_runner build
      - name: dart analyze
        working-directory: packages/dart/noports_core
        run: dart analyze
      - name: dart test
        working-directory: packages/dart/noports_core
        run: dart test
      # Runs osv-scanner to find any vulnerable Dart dependencies
      # It needs to look at pubspec.lock files, which is why it's
      # placed here, as the `dart pub get` above will create them
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=./packages/dart/noports_core/pubspec.lock
