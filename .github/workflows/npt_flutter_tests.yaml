name: npt_flutter

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - trunk

    paths:
      - ".github/workflows/npt_flutter_tests.yaml"
      - "packages/dart/npt_flutter/**"

  pull_request:
    branches:
      - trunk
    paths:
      - ".github/workflows/npt_flutter_tests.yaml"
      - "packages/dart/npt_flutter/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
      - name: flutter pub get
        working-directory: packages/dart/npt_flutter
        run: flutter pub get
      - name: Create .env file for tests
        working-directory: packages/dart/npt_flutter
        run: touch .env
      - name: Run build runner
        working-directory: packages/dart/npt_flutter
        run: dart run build_runner build --delete-conflicting-outputs
      - name: flutter analyze
        working-directory: packages/dart/npt_flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: flutter test --exclude-tags=integration
        working-directory: packages/dart/npt_flutter
        run: flutter test --exclude-tags=integration
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./packages/dart/npt_flutter/pubspec.lock
