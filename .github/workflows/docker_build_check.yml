# Builds the sshnpd family of images on PRs without pushing them.
#
# dockerhub_sshnpd.yml only runs on trunk pushes and tags, and it publishes with
# push: true -- so until this existed, the first build of a changed Dockerfile
# WAS the release build, and any breakage landed on trunk before anyone saw it.
name: docker_build_check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - trunk
    paths:
      - packages/dart/sshnoports/**
      - packages/dart/noports_core/**
      - tools/static-openssh/**
      - .github/workflows/docker_build_check.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.platforms }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 covers every image: catches Dockerfile syntax, a dependency
          # that no longer resolves, a lockfile that --enforce-lockfile rejects.
          - { name: sshnpd,           os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile }
          - { name: activate_sshnpd,  os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.activate }
          - { name: sshnp_sshnpd,     os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.sshnp }
          - { name: npp_sshnpd,       os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.npp }
          - { name: npt_sshnpd,       os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.npt }
          - { name: srvd,             os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.srvd }
          - { name: sshnpd-slim,      os: ubuntu-24.04, platforms: linux/amd64, dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.sshnpd-slim }
          # sshnpd-slim also gets the arm platforms, on a native arm runner. It
          # is the only FROM scratch image and the only one that cross-builds
          # static OpenSSH, so it is the only one whose build is arch-sensitive
          # -- the rest are the same debian:stable-slim runtime on every arch.
          - { name: sshnpd-slim,      os: ubuntu-24.04-arm, platforms: "linux/arm64,linux/arm/v7", dockerfile: ./packages/dart/sshnoports/tools/Dockerfile.sshnpd-slim }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Never push from a PR: this job takes untrusted code and holds no
          # registry credentials by design.
          push: false
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.os }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.os }}
