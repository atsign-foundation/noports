name: Promote Canary

on:
  push:
    tags:
      - 'r*.*.*' 
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: Select image to promote
        options:
          - sshnpd
          - activate_sshnpd
          - sshnp_sshnpd
          - npt_sshnpd
          - sshnpd-slim
          - srvd

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  single:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # for creating OIDC tokens for signing.
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote canary to latest
        run: |
          docker buildx imagetools create -t \
            atsigncompany/${{ github.event.inputs.image }}:latest \
            atsigncompany/${{ github.event.inputs.image }}:canary
          docker buildx imagetools create -t \
            atsigncompany/${{ github.event.inputs.image }}:prod \
            atsigncompany/${{ github.event.inputs.image }}:canary
          docker buildx imagetools create -t \
            atsigncompany/${{ github.event.inputs.image }}:prod-wd-gha${{ github.run_number }} \
            atsigncompany/${{ github.event.inputs.image }}:canary
          LATEST="atsigncompany/${{ github.event.inputs.image }}:latest"
          LATEST_DIGEST=$(docker buildx imagetools inspect ${LATEST} \
            --format "{{json .Manifest}}" | jq -r .digest)
          IMAGES="${LATEST}@${LATEST_DIGEST}"
          IMAGES+=" atsigncompany/${{ github.event.inputs.image }}:prod@${LATEST_DIGEST}"
          IMAGES+=" atsigncompany/${{ github.event.inputs.image }}:prod-wd-gha${{ github.run_number }}@${LATEST_DIGEST}"
          cosign sign --yes ${IMAGES}

  multi:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # for creating OIDC tokens for signing.
    strategy:
      matrix:
        include:
          - name: sshnpd
          - name: activate_sshnpd
          - name: sshnp_sshnpd
          - name: npt_sshnpd
          - name: sshnpd-slim
          - name: srvd
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote canary to latest
        run: |
          docker buildx imagetools create -t \
            atsigncompany/${{ matrix.name }}:latest \
            atsigncompany/${{ matrix.name }}:canary
          docker buildx imagetools create -t \
            atsigncompany/${{ matrix.name }}:prod \
            atsigncompany/${{ matrix.name }}:canary
          docker buildx imagetools create -t \
            atsigncompany/${{ matrix.name }}:prod-${{ github.ref_name }} \
            atsigncompany/${{ matrix.name }}:canary
          LATEST="atsigncompany/${{ matrix.name }}:latest"
          LATEST_DIGEST=$(docker buildx imagetools inspect ${LATEST} \
            --format "{{json .Manifest}}" | jq -r .digest)
          IMAGES="${LATEST}@${LATEST_DIGEST}"
          IMAGES+=" atsigncompany/${{ matrix.name }}:prod@${LATEST_DIGEST}"
          IMAGES+=" atsigncompany/${{ matrix.name }}:prod-${{ github.ref_name }}@${LATEST_DIGEST}"
          cosign sign --yes ${IMAGES}
