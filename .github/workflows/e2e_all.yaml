name: e2e_all

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
    branches:
      - trunk

  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - trunk

jobs:
  e2e_all:
    if:
      ${{ github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'}}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install expect
        run: |
          sudo apt-get install -y expect

      - name: Add VE host entry
        run: |
          echo '127.0.0.1 vip.ve.atsign.zone' | sudo tee -a /etc/hosts

      - name: Setup VE
        run: |
          tests/tools/ve/setup_ve.sh

      - name: Start srvd relay
        run: |
          tests/tools/ve/start_srvd.sh "@relay1" "vip.ve.atsign.zone"

      - name: Set stuff up
        run: |
          mkdir -p /tmp/e2e_all

      - name: Execute tests/e2e_all/scripts/main.sh
        run: |
          echo "Test started at: $(date)"
          start_time=$(date +%s)
          tests/e2e_all/scripts/main.sh \
            @colin \
            @barbara \
            @relay1 \
            @chris \
            @curtly \
            @gareth \
            @gary \
            -p -r vip.ve.atsign.zone
          test_exit_code=$?
          end_time=$(date +%s)
          echo "Test finished at: $(date)"
          echo "Total execution time: $((end_time - start_time)) seconds"
          exit $test_exit_code

      - name: Stop srvd relay
        if: always()
        run: |
          tests/tools/ve/stop_srvd.sh

      - name: Teardown VE
        if: always()
        run: |
          tests/tools/ve/teardown_ve.sh

      - name: Zip /tmp/e2e_all
        if: ${{ always() }}
        run: |
          zip -r tmp_e2e_all_artifacts.zip /tmp/e2e_all

      - name: Upload /tmp/e2e_all as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmp_e2e_all_artifacts
          path: tmp_e2e_all_artifacts.zip

  npe2e_core_tests:
    if:
      ${{ github.event.pull_request.head.repo.fork == false && github.actor !=
      'dependabot[bot]'}}
    name: npe2e (core_tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install expect
        run: |
          sudo apt-get install -y expect

      - name: Set up atKeys from GitHub secrets
        run: |
          mkdir -p ~/.atsign/keys/
          echo '${{ secrets.ATKEYS_NPE2E_ORG_CLIENT01_JTTEST }}' > ~/.atsign/keys/@npe2e_org_client01_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_CLIENT02_JTTEST }}' > ~/.atsign/keys/@npe2e_org_client02_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_DAEMON01_JTTEST }}' > ~/.atsign/keys/@npe2e_org_daemon01_jttest_key.atKeys

      - name: dart pub get (tests/npe2e)
        working-directory: tests/npe2e
        run: |
          dart pub get

      - name: dart pub get (packages/dart/sshnoports)
        working-directory: packages/dart/sshnoports
        run: |
          dart pub get

      - name: Env variables
        run: |
          echo "LOGS_DIR=npe2e_core_tests" >> $GITHUB_ENV
          echo "TEST_RUN_ID=$(echo "${{ github.run_id }}-${{ github.run_attempt }}" | md5sum | cut -c1-8)" >> $GITHUB_ENV

      - name: Run npe2e core_tests
        run: |
          dart run tests/npe2e/bin/core_tests.dart \
            --client-atsign "@npe2e_org_client01_jttest" \
            --daemon-atsign "@npe2e_org_daemon01_jttest" \
            --relay-atsign "@rv_am" \
            --root-domain "root.atsign.org" \
            --base-directory "$LOGS_DIR" \
            --test-run-id "$TEST_RUN_ID" \
            --batch-size 5

      - name: Zip npe2e artifacts
        if: always()
        run: |
          if [ -d "$LOGS_DIR" ]; then
            zip -r npe2e_core_tests_artifacts.zip "$LOGS_DIR"
            echo "Zipped $LOGS_DIR directory contents into npe2e_core_tests_artifacts.zip"
          else
            echo "No $LOGS_DIR directory found. Skipping zipping artifacts."
          fi

      - name: Upload npe2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npe2e_core_tests_artifacts
          path: npe2e_core_tests_artifacts.zip
          if-no-files-found: warn

  npe2e_policy_tests:
    if:
      ${{ github.event.pull_request.head.repo.fork == false && github.actor !=
      'dependabot[bot]'}}
    name: npe2e (policy_tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install expect
        run: |
          sudo apt-get install -y expect

      - name: Add VE host entry
        run: |
          echo '127.0.0.1 vip.ve.atsign.zone' | sudo tee -a /etc/hosts

      - name: Setup VE
        run: |
          tests/tools/ve/setup_ve.sh

      - name: dart pub get (tests/npe2e)
        working-directory: tests/npe2e
        run: |
          dart pub get

      - name: dart pub get (packages/dart/sshnoports)
        working-directory: packages/dart/sshnoports
        run: |
          dart pub get

      - name: Env variables
        run: |
          echo "LOGS_DIR=npe2e_policy_tests" >> $GITHUB_ENV
          echo "TEST_RUN_ID=$(echo "${{ github.run_id }}-${{ github.run_attempt }}" | md5sum | cut -c1-8)" >> $GITHUB_ENV

      - name: Start srvd relay
        run: |
          tests/tools/ve/start_srvd.sh "@relay1" "vip.ve.atsign.zone"

      - name: Run npe2e policy_tests
        run: |
          dart run tests/npe2e/bin/policy_tests.dart \
            --client-atsign "@denise" \
            --daemon-atsign "@don" \
            --relay-atsign "@relay1" \
            --npp-atsign "@xavier" \
            --npp-atserver-atsign "@jeremy" \
            --root-domain "vip.ve.atsign.zone" \
            --base-directory "$LOGS_DIR" \
            --test-run-id "$TEST_RUN_ID" \
            --test-timeout-seconds 480 \
            --batch-size 2

      - name: Stop srvd relay
        if: always()
        run: |
          tests/tools/ve/stop_srvd.sh

      - name: Teardown VE
        if: always()
        run: |
          tests/tools/ve/teardown_ve.sh

      - name: Zip npe2e artifacts
        if: always()
        run: |
          if [ -d "$LOGS_DIR" ]; then
            zip -r npe2e_policy_tests_artifacts.zip "$LOGS_DIR"
            echo "Zipped $LOGS_DIR directory contents into npe2e_policy_tests_artifacts.zip"
          else
            echo "No $LOGS_DIR directory found. Skipping zipping artifacts."
          fi

      - name: Upload npe2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npe2e_policy_tests_artifacts
          path: npe2e_policy_tests_artifacts.zip
          if-no-files-found: warn

  npe2e_relay_tests:
    if:
      ${{ github.event.pull_request.head.repo.fork == false && github.actor !=
      'dependabot[bot]'}}
    name: npe2e (relay_tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install expect
        run: |
          sudo apt-get install -y expect

      - name: Set up atKeys from GitHub secrets
        run: |
          mkdir -p ~/.atsign/keys/
          echo '${{ secrets.ATKEYS_NPE2E_ORG_CLIENT03_JTTEST }}' > ~/.atsign/keys/@npe2e_org_client03_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_DAEMON03_JTTEST }}' > ~/.atsign/keys/@npe2e_org_daemon03_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY01_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay01_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY02_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay02_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY03_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay03_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY04_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay04_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY05_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay05_jttest_key.atKeys
          echo '${{ secrets.ATKEYS_NPE2E_ORG_RELAY06_JTTEST }}' > ~/.atsign/keys/@npe2e_org_relay06_jttest_key.atKeys

      - name: dart pub get (tests/npe2e)
        working-directory: tests/npe2e
        run: |
          dart pub get

      - name: dart pub get (packages/dart/sshnoports)
        working-directory: packages/dart/sshnoports
        run: |
          dart pub get

      - name: Env variables
        run: |
          echo "LOGS_DIR=npe2e_relay_tests" >> $GITHUB_ENV
          echo "TEST_RUN_ID=$(echo "${{ github.run_id }}-${{ github.run_attempt }}" | md5sum | cut -c1-8)" >> $GITHUB_ENV

      - name: Run npe2e relay_tests
        run: |
          dart run tests/npe2e/bin/relay_tests.dart \
            --client-atsign "@npe2e_org_client03_jttest" \
            --daemon-atsign "@npe2e_org_daemon03_jttest" \
            --prod-relay "@rv_am" \
            --self-relay-atsigns "@npe2e_org_relay01_jttest,@npe2e_org_relay02_jttest,@npe2e_org_relay03_jttest,@npe2e_org_relay04_jttest,@npe2e_org_relay05_jttest,@npe2e_org_relay06_jttest" \
            --root-domain "root.atsign.org" \
            --base-directory "$LOGS_DIR" \
            --client-versions "d:v5.13.0,d:v5.14.13,d:current" \
            --daemon-versions "d:v5.13.0,d:v5.14.13,d:current" \
            --self-relay-versions "d:v5.10.0,d:v5.14.13,d:current" \
            --test-run-id "$TEST_RUN_ID" \
            --batch-size 3

      - name: Zip npe2e artifacts
        if: always()
        run: |
          if [ -d "$LOGS_DIR" ]; then
            zip -r npe2e_relay_tests_artifacts.zip "$LOGS_DIR"
            echo "Zipped $LOGS_DIR directory contents into npe2e_relay_tests_artifacts.zip"
          else
            echo "No $LOGS_DIR directory found. Skipping zipping artifacts."
          fi

      - name: Upload npe2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npe2e_relay_tests_artifacts
          path: npe2e_relay_tests_artifacts.zip
          if-no-files-found: warn
