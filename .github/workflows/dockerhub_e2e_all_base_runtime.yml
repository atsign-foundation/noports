name: dockerhub_e2e_all_base_runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 1' # At 0647 each Monday

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  docker_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: ./tests/e2e_all/dockerfiles/Dockerfile.base.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            atsigncompany/noports_e2e_all_base_runtime:latest
            atsigncompany/noports_e2e_all_base_runtime:gha${{ github.run_number }}
