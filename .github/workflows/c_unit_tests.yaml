name: C Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions: # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  unit-tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # Pin cmake to <4.0.0
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: "3.31.11"

      - name: sshnpd and srv Unit CTest
        working-directory: packages/c
        run: |
          cmake -S . -B build -DSSHNPD_BUILD_TESTS=ON -DSRV_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build/sshnpd/tests --output-on-failure --timeout 2
          ctest --test-dir build/_deps/srv-lib-build/tests --output-on-failure --timeout 10

      # The srv teardown regression test (issue #2891) can only fail on musl
      # x86-64: glibc masks the corruption it guards against by caching joined
      # thread stacks instead of unmapping them. Run the srv suite once more in
      # an Alpine container so the guard has teeth.
      - name: srv Unit CTest (musl x86-64)
        run: |
          docker run --rm -v "$PWD/packages/c:/src" alpine:3.21 sh -c '
            apk add --no-cache build-base clang cmake git python3 &&
            cmake -S /src/srv -B /build -DSRV_BUILD_TESTS=ON -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="-Wno-error -pthread" &&
            cmake --build /build -j"$(nproc)" &&
            ctest --test-dir /build/tests --output-on-failure --timeout 10'
