name: noports_config

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Also publish the archives as assets on the noports_config-dev prerelease"
        type: boolean
        default: false
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/noports_config_tests.yaml"
      - "packages/dart/noports_config/**"
      - "packages/dart/noports_core/**"
  pull_request:
    branches:
      - trunk
    paths:
      - ".github/workflows/noports_config_tests.yaml"
      - "packages/dart/noports_config/**"
      - "packages/dart/noports_core/**"

defaults:
  run:
    working-directory: packages/dart/noports_config

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Generated l10n is committed and up to date
        run: git diff --exit-code -- lib/l10n
      - run: flutter analyze
      - run: flutter test
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./packages/dart/noports_config/pubspec.lock

  # Proves the desktop targets compile and produces one archive per target
  # for hands-on testing. The MSI build in multibuild.yaml only runs on
  # release tags, so this is the day-to-day check.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            arch: x64
            bundle: build/windows/x64/runner/Release
          # Native Windows on ARM. Experimental: Flutter builds arm64 only
          # on an arm64 host, and the NoPorts CLI binaries are not shipped
          # for Windows arm64 yet, so the app would run but find no daemon.
          - os: windows-11-arm
            target: windows
            arch: arm64
            bundle: build/windows/arm64/runner/Release
            experimental: true
          - os: ubuntu-latest
            target: linux
            arch: x64
            bundle: build/linux/x64/release/bundle
          # Flutter desktop supports x64 and arm64 on Linux, not armv7 or
          # riscv64, so the daemon's other Linux targets have no app build.
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            bundle: build/linux/arm64/release/bundle
          # Flutter macOS release builds are universal (arm64 + x86_64).
          - os: macos-latest
            target: macos
            arch: universal
            bundle: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      ARCHIVE_BASE: noports_config-${{ matrix.target }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: ${{ matrix.arch != 'arm64' }}
        with:
          channel: "stable"
          cache: false
      # Flutter publishes SDK archives for x64 hosts only, so the action has
      # nothing to download on ARM runners. A shallow clone of the stable
      # branch bootstraps the matching arm64 Dart SDK and engine artifacts.
      - name: Install Flutter from git (arm64 hosts)
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Linux desktop build dependencies
        if: ${{ matrix.target == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: Bundle the Visual C++ runtime (Windows only)
        if: ${{ matrix.target == 'windows' }}
        shell: pwsh
        run: ./tools/bundle_msvc_runtime.ps1 -Destination "${{ matrix.bundle }}"
      - name: Archive (Windows)
        if: ${{ matrix.target == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "${{ matrix.bundle }}\*" -DestinationPath "dist\$env:ARCHIVE_BASE.zip"
          Get-ChildItem dist
      - name: Archive (Linux)
        if: ${{ matrix.target == 'linux' }}
        run: |
          mkdir -p dist
          tar -C "${{ matrix.bundle }}" -czf "dist/$ARCHIVE_BASE.tar.gz" .
          ls -l dist
      - name: Archive (macOS)
        if: ${{ matrix.target == 'macos' }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${{ matrix.bundle }}/NoPorts Configuration.app" "dist/$ARCHIVE_BASE.zip"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_BASE }}
          path: packages/dart/noports_config/dist/*
          retention-days: 14
          if-no-files-found: error

  # Opt in from "Run workflow" to publish every archive as an asset on the
  # rolling `noports_config-dev` prerelease, so testers can download them
  # without a GitHub login or digging through run artifacts.
  prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: noports_config-dev
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease \
              --notes "Development build of NoPorts Configuration from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}. Not for production." >/dev/null
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "NoPorts Configuration (dev build)" \
              --notes "Development build of NoPorts Configuration from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}. Not for production." >/dev/null
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json url -q .url
