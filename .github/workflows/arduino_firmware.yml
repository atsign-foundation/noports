name: Arduino Firmware

# Builds every firmware target on pull requests (build verification), and on
# version tags additionally assembles single-file factory images and attaches
# them to the GitHub release.

on:
  pull_request:
    branches: ["trunk"]
    paths:
     - 'packages/arduino/**'
  push:
    tags: ["a*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pioarduino platform used by esp32p4 produces a merged
          # firmware.factory.bin itself; the CYD targets use the older
          # espressif32 platform, so their images are merged with esptool.
          - name: NoPorts_PoE-esp32p4
            project: packages/arduino/packages/NoPorts_PoE
            pio_env: esp32p4
            factory: platform # firmware.factory.bin comes from the platform
          - name: NoPorts_CYD-cyd
            project: packages/arduino/packages/NoPorts_CYD
            pio_env: cyd
            chip: esp32
            flash_size: 4MB
            flash_freq: 40m
            bootloader_offset: "0x1000"
          - name: NoPorts_CYD-cyd2usb
            project: packages/arduino/packages/NoPorts_CYD
            pio_env: cyd2usb
            chip: esp32
            flash_size: 4MB
            flash_freq: 40m
            bootloader_offset: "0x1000"
          - name: NoPorts_CYD-cyd2usb_s3
            project: packages/arduino/packages/NoPorts_CYD
            pio_env: cyd2usb_s3
            chip: esp32s3
            flash_size: 16MB
            flash_freq: 80m
            bootloader_offset: "0x0"
          - name: NoPorts_CYD-crowpanel_adv7
            project: packages/arduino/packages/NoPorts_CYD
            pio_env: crowpanel_adv7
            chip: esp32s3
            flash_size: 16MB
            flash_freq: 80m
            bootloader_offset: "0x0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ${{ matrix.project }}
          activate-environment: true

      # uv used with lock file to ensure dependencies pinned to hashes
      # esptool pinned to 4.x: v5 renamed merge_bin and changed CLI flags
      - name: Install PlatformIO + esptool
        run: uv pip install --require-hashes -r packages/arduino/tools/pylock.toml

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.name }}-

      - name: Build
        working-directory: ${{ matrix.project }}
        run: pio run -e ${{ matrix.pio_env }}

      - name: Assemble factory image
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          OUT="$RUNNER_TEMP/assets"
          mkdir -p "$OUT"
          BUILD=".pio/build/${{ matrix.pio_env }}"
          if [[ "${{ matrix.factory }}" == "platform" ]]; then
            cp "$BUILD/firmware.factory.bin" "$OUT/${{ matrix.name }}-$VERSION.factory.bin"
          else
            # boot_app0.bin ships inside the Arduino framework package
            BOOT0=$(ls "$HOME"/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin | head -1)
            python -m esptool --chip ${{ matrix.chip }} merge_bin \
              -o "$OUT/${{ matrix.name }}-$VERSION.factory.bin" \
              --flash_mode dio --flash_freq ${{ matrix.flash_freq }} --flash_size ${{ matrix.flash_size }} \
              ${{ matrix.bootloader_offset }} "$BUILD/bootloader.bin" \
              0x8000 "$BUILD/partitions.bin" \
              0xe000 "$BOOT0" \
              0x10000 "$BUILD/firmware.bin"
          fi
          ls -la "$OUT"

      - name: Sanitise GitHub ref
        id: sanitise
        shell: bash
        run: |
          # Replaces both / and \ with -
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/\\' '--')
          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: sbomify/github-action@57ca9ba7de2232b073a3799bc8c0dc002e6777b9 # v26.10.2
        env:
          TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          COMPONENT_ID: 'azZJvaqsyGMC'
          LOCK_FILE: '${{ matrix.project }}/platformio.ini'
          COMPONENT_VERSION: ${{ matrix.name }}-${{steps.sanitise.outputs.safe_ref}}-gha${{github.run_number}}
          OUTPUT_FILE: '${{ runner.temp }}/assets/${{ matrix.name }}-${{steps.sanitise.outputs.safe_ref}}-sbom.cdx.json'
          AUGMENT: true
          ENRICH: true
          UPLOAD: true


      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/assets/*.factory.bin
            ${{ runner.temp }}/assets/*sbom.cdx.json
          if-no-files-found: error

  release:
    name: Attach release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: write # Mandatory for making GitHub Releases
      id-token: write # Mandatory for sigstore
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: sha256sum *.factory.bin *sbom.cdx.json > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --latest=false
          fi
          gh release upload "$TAG" assets/*.factory.bin assets/*sbom.cdx.json assets/SHA256SUMS --clobber

      - id: hash
        name: Pass artifact hashes for SLSA provenance
        working-directory: assets
        run: |
          echo "hashes=$(cat SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: GitHub attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "assets/**"

  provenance:
    needs: [release]
    permissions:
      actions: read # Needed for detection of GitHub Actions environment.
      id-token: write # Needed for provenance signing and ID
      contents: write # Needed for release uploads
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # 5a775b367a56d5bd118a224a811bba288150a563
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
