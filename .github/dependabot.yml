version: 2
enable-beta-ecosystems: true
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/packages/arduino/packages/NoPorts_CYD/"
      - "/packages/arduino/packages/NoPorts_PoE/"
      - "/packages/arduino/web/"
      - "/packages/c/sshnpd/tools/"
      - "/packages/dart/sshnoports/tools/"
      - "/tests/e2e_all/dockerfiles/"
      - "/tests/npe2e/tools/dockerfiles/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
      - "atsigncompany/*"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directories:
      - "/packages/dart/sshnoports/"
      - "/packages/dart/noports_core/"
      - "/packages/dart/npt_flutter/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
      - "at_*"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # NOTE at_lookup 3.7.0 needs at_client 4.0.0
      - dependency-name: "at_lookup"
    groups:
      pub:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/packages/csharp/AtscLauncher/src/"
      - "/packages/csharp/AtscLauncher/test/"
      - "/packages/csharp/WindowsBinaryService/"
      - "/packages/csharp/WindowsBinaryService.Tests/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: 'npm'
    directory: "/apps/admin/webapp/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/packages/arduino/tools" # Location of package manifests
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pip:
        patterns:
          - "*"
