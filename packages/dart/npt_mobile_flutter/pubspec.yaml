name: npt_mobile_flutter
description: "NoPorts Mobile app for iOS and Android"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  adaptive_theme: ^3.6.0
  at_auth: ^2.4.0
  at_client_mobile: ^3.2.24
  at_client: ^3.8.0
  at_contact: ^3.0.8
  at_onboarding_flutter: ^6.1.12
  at_server_status: ^1.1.1
  at_utils: ^3.0.16
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.3.3
  equatable: ^2.0.5
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  intl: any
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  meta: ^1.15.0
  noports_core:
    path: ../noports_core
  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  phosphor_flutter: ^2.1.0
  pin_code_fields: ^8.0.1
  socket_connector: ^2.4.1
  toml: ^0.16.0
  url_launcher: ^6.3.0
  uuid: ^4.0.0
  visibility_detector: ^0.4.0+2
  yaml: ^3.1.2
  yaml_writer: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.12
  flutter_launcher_icons: "^0.14.1"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.5.0
  bloc_test: ^9.1.7

dependency_overrides:
  archive: ^4.0.7
  file: ^7.0.0
  file_picker: ^10.3.3
  intl: 0.20.2
  device_info_plus: 11.3.3

  at_auth: ^2.4.0  # Override at_client_flutter's at_auth ^3.0.0 requirement
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
