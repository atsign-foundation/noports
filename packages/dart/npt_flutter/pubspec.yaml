name: npt_flutter
description: "NoPorts Desktop app"
publish_to: "none"

version: 1.8.1+26

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  adaptive_theme: ^3.7.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.11
  flutter_dotenv: ^5.2.1
  phosphor_flutter: ^2.1.0
  pin_code_fields: ^8.0.1
  visibility_detector: ^0.4.0+2

  http: ^1.3.0
  intl: ^0.20.2
  meta: ^1.18.1
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_writer: ^2.0.0
  toml: ^0.16.0
  uuid: ^4.5.0

  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  tray_manager: ^0.5.1
  window_manager: ^0.4.2
  url_launcher: ^6.3.1

  socket_connector: ^2.4.1

  # Atsign ecosystem (KEEP STABLE)
  at_auth: ^2.4.0
  at_backupkey_flutter: ^4.0.16
  at_client: ^3.8.0
  at_client_mobile: ^3.2.24
  at_contact: ^3.0.8
  at_contacts_flutter: ^4.0.15
  at_server_status: ^1.1.1
  at_utils: ^3.0.16

  at_onboarding_flutter:
    git:
      url: https://github.com/atsign-foundation/at_widgets.git
      path: packages/at_onboarding_flutter

  noports_core:
    path: ../noports_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mockito: ^5.5.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.8

dependency_overrides:
  archive: ^4.0.7
  intl: 0.20.2
  file: 7.0.1

  dartssh2:
    git:
      url: https://github.com/atsign-foundation/dartssh2
      ref: trunk

  at_client_mobile:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: 4e7701af851be6a7c45ef2cecbf4048c80814261
      path: packages/at_client_mobile
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - .env
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  macos:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
