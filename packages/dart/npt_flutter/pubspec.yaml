name: npt_flutter
description: "NoPorts Desktop app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.0+30
msix_config:
  display_name: "NoPorts Desktop"
  publisher_display_name: Atsign Inc
  identity_name: TheCompany.NoPortsDesktop
  publisher: CN=BBFE1D0B-F713-4C7F-B375-5EA851CBB1FF
  msix_version: 1.9.3.0
  logo_path: "assets/logo.png"
  capabilities: internetClient
  store: true

environment:
  sdk: ^3.10.0

dependencies:
  adaptive_theme: ^3.6.0
  at_auth: ^3.3.0
  at_client: ^3.11.0
  at_client_flutter: ^1.1.4
  at_contact: ^3.0.8
  at_lookup: ^3.5.0
  at_server_status: ^1.1.1
  at_utils: ^3.0.16
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.7.0
  device_info_plus: ^11.3.3
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  file_picker: ^11.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  intl: any
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  meta: ^1.15.0
  noports_core:
    path: ../noports_core
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.4
  phosphor_flutter: ^2.1.0
  pin_code_fields: ^8.0.1
  socket_connector: ^2.4.1
  super_tooltip: ^2.1.0
  toml: ^0.16.0
  tray_manager: ^0.5.1
  url_launcher: ^6.3.0
  uuid: ^4.0.0
  visibility_detector: ^0.4.0+2
  window_manager: ^0.4.2
  yaml: ^3.1.2
  yaml_writer: ^2.0.0
dev_dependencies:
  build_runner: ^2.10.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: "^0.14.1"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.5.0
  msix: ^3.16.8

dependency_overrides:
  at_auth: ^3.2.0
  at_chops: ^3.4.1
  at_client: ^3.12.0
  at_onboarding_cli: ^1.16.0
  archive: ^4.0.7
  file_picker: ^11.0.0
  package_info_plus: ^9.0.1
  intl: 0.20.2
  device_info_plus: 11.3.3
  file: 7.0.1
  meta: ^1.17.0
  chalkdart: ^2.2.1
  at_utils: ^3.0.15
  pointycastle: ^4.0.0
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  macos:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
