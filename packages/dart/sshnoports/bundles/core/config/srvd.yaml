# Main service's atSign authentication information
atsign:
  # The atsign to run the service as
  # Examples:
  # `atsign: '@relay_np'`
  # `atsign: relay_np`
  # Don't do the following, as the '@' symbol is a special character in yaml:
  # `atsign: @relay_np`
  # TODO: MANDATORY SETTING
  atsign:

  # The path to the .atKeys file for the atsign, only needed if not
  # located at the default path.
  # Default for the 'atsign' example above:
  # `keys: ~/.atsign/keys/@relay_np_key.atKeys`
  keys:

  # The passphrase for the atKeys file if the file has been protected.
  # Example:
  # `passphrase: 'my-pass-phrase'`
  passphrase:

  # The root configuration for the atPlatform
  # Examples:
  # `root: root.atsign.org` (The default)
  # `root: proxy:proxy0001.atsign.org:443`
  # `root: my.enterprise.root:64`
  root:

# Access control for the relay service
access:
  # Restrict relay usage to a single manager atSign.
  # If left empty then srvd is open to any authorized atSign.
  # Example:
  # `managers: manager_np`
  managers:

# Network settings for the relay
network:
  # The public IP address or hostname that clients should connect to.
  # This value is advertised to clients and is required.
  # Examples:
  # `ip: relay.example.com`
  # `ip: 203.0.113.42`
  # TODO: MANDATORY SETTING
  ip:

  # The actual local port that srvd binds for relay traffic.
  # Useful when port 443 on the host is forwarded into a container.
  # Default:
  # `443-bind-port: 443`
  443-bind-port: 443

  # Also bind directly to port 443.
  # Default:
  # `bind-443: false`
  bind-443: false

# Additional runtime settings for the service
runtime:
  # Unnecessary unless you are running multiple srvd instances under the same
  # user with the same atSign on the same host.
  storage-path:

  # Log proxied traffic metadata.
  # Default:
  # `log-traffic: true`
  log-traffic: true

  # Use per-session ephemeral local storage. Recommended.
  # Default:
  # `per-session-storage: true`
  per-session-storage: true

  # Enable verbose logging.
  # Default:
  # `verbose: false`
  verbose: false

