name: sshnoports
publish_to: none

version: 5.18.2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  noports_core:
    path: "../noports_core"
  at_commons: ^5.21.0
  at_client_cli: ^1.0.0
  at_client: ^4.0.0
  args: 2.7.0
  socket_connector: 2.6.1
  # Pinned: dartssh2 added SSHSocket.flush in the 2.22.2 minor release (a semver
  # slip that breaks `implements SSHSocket`), so pin it here rather than let this
  # app float to a surprise-breaking release.
  dartssh2: 2.22.2
  duration: 4.0.3
  at_utils: ^4.0.0
  logging: 1.3.0
  chalkdart: ^2.3.3
  cli_menu: ^0.4.0+1
  yaml: 3.1.3
  config: ^0.8.4

dependency_overrides:
  at_auth:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_auth
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_chops
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_client
  at_client_cli:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_client_cli
  at_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_commons
  at_lookup:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_lookup
  at_utils:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_utils
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  mocktail: ^1.0.4
  build_runner: 2.13.1
  build_version: ^2.1.3
