name: sshnoports
publish_to: none

version: 5.14.12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  noports_core:
    path: "../noports_core"
  at_onboarding_cli: ^1.14.2
  at_commons: ^5.7.0
  at_cli_commons: ^3.0.1
  at_client: ^3.10.0
  args: 2.7.0
  socket_connector: 2.4.1
  dartssh2: 2.11.0
  duration: 4.0.3
  at_utils: 3.4.0
  logging: 1.3.0
  chalkdart: ^2.3.3
  cli_menu: ^0.4.0+1
  yaml: 3.1.3
  config: ^0.8.4

dependency_overrides:
  at_client:
    git:
      ref: trunk
      url: https://github.com/atsign-foundation/at_client_sdk
      path: packages/at_client
  archive: ^4.0.7
  dartssh2:
    git:
      url: https://github.com/atsign-foundation/dartssh2
      ref: trunk
  at_onboarding_cli:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      path: packages/at_onboarding_cli
      ref: st/onb-cli-remove-wait-pkam-auth
  at_auth:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      path: packages/at_auth
      ref: st/onb-cli-remove-wait-pkam-auth

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
  mocktail: ^1.0.4
  build_runner: 2.12.2
  build_version: ^2.1.3
