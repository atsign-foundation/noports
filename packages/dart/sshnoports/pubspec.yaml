name: sshnoports
publish_to: none

version: 5.10.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  noports_core:
    path: "../noports_core"
  at_onboarding_cli: 1.10.0
  at_commons: ^5.4.0
  at_cli_commons: 2.1.0
  at_client: 3.4.2
  args: 2.6.0
  socket_connector: 2.3.3
  dartssh2: 2.11.0
  duration: 4.0.3
  at_utils: 3.2.0
  logging: 1.3.0
  chalkdart: ^2.3.3
  yaml: 3.1.3

dependency_overrides:
  at_onboarding_cli:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: remove-dependency-from-onboarding-cli
      path: packages/at_onboarding_cli
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: at-rpc-enable-same-atsign
      path: packages/at_client
  dartssh2:
    git:
      url: https://github.com/atsign-foundation/dartssh2
      ref: trunk
  args:
    git:
      ref: gkc/show-aliases-in-usage
      url: https://github.com/gkc/args

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  mocktail: ^1.0.4
  build_runner: ^2.4.15
  build_version: ^2.1.1
