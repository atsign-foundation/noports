name: sshnoports
publish_to: none

version: 5.18.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  noports_core:
    path: "../noports_core"
  at_onboarding_cli: ^2.0.0-rc3
  at_commons: ^5.18.0
  at_cli_commons: ^3.1.2-rc2
  at_client: ^3.15.0-rc3
  args: 2.7.0
  socket_connector: 2.6.0
  # Pinned: dartssh2 added SSHSocket.flush in the 2.22.2 minor release (a semver
  # slip that breaks `implements SSHSocket`), so pin it here rather than let this
  # app float to a surprise-breaking release.
  dartssh2: 2.22.2
  duration: 4.0.3
  at_utils: ^3.4.1
  logging: 1.3.0
  chalkdart: ^2.3.3
  cli_menu: ^0.4.0+1
  yaml: 3.1.3
  config: ^0.8.4

dependency_overrides:
  # NOTE holdsPrivate and receivedUnder are not in a published at_client yet.
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: abb27e57cb525d94f13a5413d22aac3387eac150
      path: packages/at_client
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  mocktail: ^1.0.4
  build_runner: 2.13.1
  build_version: ^2.1.3
