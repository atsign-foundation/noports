name: sshnoports
publish_to: none

version: 5.16.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  noports_core:
    path: "../noports_core"
  at_onboarding_cli: ^1.14.2
  at_commons: ^5.7.0
  at_cli_commons: ^3.0.1
  at_client: ^3.11.0
  args: 2.7.0
  socket_connector: 2.6.0
  # Pinned: dartssh2 added SSHSocket.flush in the 2.22.2 minor release (a semver
  # slip that breaks `implements SSHSocket`), so pin it here rather than let this
  # app float to a surprise-breaking release.
  dartssh2: 2.22.2
  duration: 4.0.3
  at_utils: 3.4.0
  logging: 1.3.0
  chalkdart: ^2.3.3
  cli_menu: ^0.4.0+1
  yaml: 3.1.3
  config: ^0.8.4

dependency_overrides:
  pointycastle: ^4.0.0
  # TEMPORARY — remove once at_chops 3.7.0 is on pub.dev. noports_core's own
  # override doesn't propagate here since pub only applies overrides from the
  # root package being resolved — sshnoports resolves independently and needs
  # the same pin, or `dart compile exe bin/srv.dart` fails to find
  # AesCtrFfiCipher.updateView. See packages/dart/noports_core/pubspec.yaml.
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      path: packages/at_chops
      ref: f14248122f31f79ca0a2e24c5e6b94d7fc366881
  # TEMPORARY — remove once socket_connector publishes ChunkTransformer.
  # Same reason as at_chops above — this package resolves independently of
  # noports_core's overrides. See packages/dart/noports_core/pubspec.yaml.
  socket_connector:
    git:
      url: https://github.com/atsign-foundation/socket_connector.git
      ref: c93f103ec6156abbc8c626c0ae15e586c7e0cde8

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  mocktail: ^1.0.4
  build_runner: 2.13.1
  build_version: ^2.1.3
