name: noports_core
description: Core library code for sshnoports
homepage: https://docs.atsign.com/

version: 6.14.1+ffichunk

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.4.2
  at_auth: ^3.0.1
  at_chops: ^3.0.0
  at_client: ^3.11.0
  at_commons: ^5.8.0
  at_cli_commons: ^3.0.1
  at_utils: ^3.4.0
  at_base2e15: ^1.0.0
  archive: ^4.0.7
  cryptography: ^2.7.0
  dartssh2: ^2.17.1
  file: ^6.0.0
  logging: ^1.2.0
  meta: ^1.9.1
  openssh_ed25519: ^1.1.0
  path: ^1.9.0
  posix: ^6.0.1
  socket_connector: ^2.4.1
  uuid: ^4.0.0
  mutex: ^3.1.0
  json_annotation: ^4.9.0
  version: ^3.0.2
  config: ^0.8.0
  yaml: ^3.1.3
  at_onboarding_cli: ^1.14.2

dependency_overrides:
  pointycastle: ^4.0.0
  # TEMPORARY — integration-branch override: at_chops 3.7.0 (updateView, used
  # by createAesCtrChunkTransformer) is not yet on pub.dev; pull it from
  # at_client_sdk trunk.
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: 688486e448ed8f08b96ed92ea197072e9b1c7249
      path: packages/at_chops
  # TEMPORARY — integration-branch override: ChunkTransformer is not yet on
  # pub.dev; pull socket_connector from srei's PR #41 tip (stacked on #39: review
  # fixes for crashes, leaks, OOM), which also carries the 2.5.1 flush-gate fix.
  socket_connector:
    git:
      url: https://github.com/atsign-foundation/socket_connector.git
      ref: 313275bdf24c944e485da3e92125a09f2f6b666f

dev_dependencies:
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  build_version: ^2.1.1
  lints: ^4.0.0
  mocktail: ^1.0.1
  test: ^1.24.4
