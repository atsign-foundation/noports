name: noports_core
description: Core library code for sshnoports
homepage: https://docs.atsign.com/

version: 6.16.0

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.4.2
  at_auth: ^4.0.0-rc3
  at_chops: ^3.7.0
  at_client: ^3.15.0-rc3
  at_commons: ^5.18.0
  at_cli_commons: ^3.1.2-rc2
  at_utils: ^3.4.1
  at_base2e15: ^1.0.0
  archive: ^4.0.7
  cryptography: ^2.7.0
  dartssh2: ^2.17.1
  file: ^6.0.0
  logging: ^1.2.0
  meta: ^1.9.1
  openssh_ed25519: ^1.1.0
  path: ^1.9.0
  posix: ^6.0.1
  socket_connector: ^2.6.0
  uuid: ^4.0.0
  mutex: ^3.1.0
  json_annotation: ^4.9.0
  version: ^3.0.2
  config: ^0.8.0
  yaml: ^3.1.3
  at_onboarding_cli: ^2.0.0-rc3

dependency_overrides:
  # NOTE holdsPrivate and receivedUnder are not in a published at_client yet.
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: abb27e57cb525d94f13a5413d22aac3387eac150
      path: packages/at_client
  pointycastle: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  build_version: ^2.1.1
  lints: ^4.0.0
  at_lookup: ^3.7.0-rc3
  mocktail: ^1.0.1
  test: ^1.24.4
