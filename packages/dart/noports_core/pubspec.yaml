name: noports_core
description: Core library code for sshnoports
homepage: https://docs.atsign.com/

version: 6.16.0

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.4.2
  at_auth: ^4.0.0
  at_chops: ^3.7.0
  at_client: ^4.0.0
  at_commons: ^5.21.0
  at_cli_commons: ^4.0.0
  at_utils: ^4.0.0
  at_base2e15: ^1.0.0
  archive: ^4.0.7
  cryptography: ^2.7.0
  dartssh2: ^2.17.1
  file: ^6.0.0
  logging: ^1.2.0
  meta: ^1.9.1
  openssh_ed25519: ^1.1.0
  path: ^1.9.0
  posix: ^6.0.1
  socket_connector: ^2.6.1
  uuid: ^4.0.0
  mutex: ^3.1.0
  json_annotation: ^4.9.0
  version: ^3.0.2
  config: ^0.8.0
  yaml: ^3.1.3
  at_onboarding_cli: ^2.0.0
  at_lookup: ^4.0.0

dependency_overrides:
  at_auth:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_auth
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_chops
  at_cli_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_cli_commons
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_client
  at_client_cli:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_client_cli
  at_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_commons
  at_lookup:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_lookup
  at_onboarding_cli:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_onboarding_cli
  at_utils:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: gkc-v4-ga
      path: packages/at_utils
  pointycastle: ^4.0.0

dev_dependencies:
  # NOTE build_runner 2.16.1 does not compile against analyzer 14.5.0
  analyzer: '>=13.3.0 <14.5.0'
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  # NOTE json_serializable 6.15.0 does not compile against source_helper 1.4.0
  source_helper: '>=1.3.0 <1.4.0'
  build_version: ^2.1.1
  lints: ^4.0.0
  mocktail: ^1.0.1
  test: ^1.24.4
