; PlatformIO Project Configuration File
; NoPorts_CYD - NoPorts daemon with CYD touchscreen UI
;
; Supports:
;   - CYD (ESP32-2432S028R) - single micro-USB
;   - CYD2USB (ESP32-2432S028Rv2) - micro-USB + USB-C
;
; Board definitions come from the boards/ submodule:
;   git submodule add https://github.com/rzeldent/platformio-espressif32-sunton.git boards

[platformio]
default_envs = cyd
boards_dir = boards

[env]
; Pin to the Tasmota-fork espressif32 platform that ships framework-arduinoespressif32
; @ 2.0.9 (IDF 4.4.x).  Without this pin a fresh PlatformIO install (e.g. Docker)
; resolves to espressif32 @ 6.x (IDF 5.x) whose SPI HAL is incompatible with TFT_eSPI
; on these panels, causing a StoreProhibited crash in fillRoundRect() at boot.
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.06.02/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.sdkconfig_path = sdkconfig.defaults

build_src_filter =
  +<*>
  -<old_lvgl/>

build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
  ; TFT_eSPI configuration (memory-efficient alternative to LVGL)
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  ; Load only the fonts we actually use (1=8px, 2=16px, 4=26px)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  ; No TLS cert flag needed: CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y in sdkconfig
  ; makes at_client automatically use the ESP-IDF full Mozilla CA bundle
  ; (~130 roots, stored in flash, zero heap cost).
  ; lwIP TCP tuning is done via sdkconfig.defaults / sdkconfig.defaults.s3
  ; to avoid -D redefinition warnings against the SDK's own sdkconfig.h

lib_extra_dirs =
  ../../lib

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  thingpulse/ThingPulse XPT2046 Touch@^1.4
  atsign/at_client@^1.0.0
  NoPorts

upload_speed = 460800

[env:cyd]
board = esp32-2432S028R
build_flags =
  ${env.build_flags}
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33

[env:cyd2usb]
board = esp32-2432S028Rv2
build_flags =
  ${env.build_flags}
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33

; Freenove ESP32-S3-WROOM variant (USB-C native USB, VID:PID=303A:1001)
; 240MHz, 16MB QIO flash, 8MB OPI PSRAM, 512KB SRAM
; The S3 exposes a built-in USB JTAG/CDC device on USB-C — no CH340 needed.
; Upload via: platformio run -e cyd2usb_s3 --target upload
[env:cyd2usb_s3]
board = esp32s3-2432S028R
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.sdkconfig_path = sdkconfig.defaults.s3
upload_port = /dev/cu.usbmodem*
upload_speed = 460800
; FNK0104 has a WS2812B NeoPixel on GPIO 42 (not 3x discrete LEDs like the CYD)
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.0
; Override TFT_eSPI pin defines for Freenove FNK0104A/B (ESP32-S3 Display)
; Actual pins differ completely from the standard CYD (ESP32) used in [env]
build_flags =
  ${env.build_flags}
  -DESP32S3_2432S028R
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; FNK0104 display SPI pins (override common CYD pins)
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=1
  -DTFT_INVERSION_ON
  ; Touch: no XPT2046 on FNK0104; undefine to prevent conflicts
  -DTOUCH_CS=-1
  ; Backlight GPIO (CYD=21, FNK0104=45)
  -DDISPLAY_BCKL=45

; ─────────────────────────────────────────────────────────────
; Elecrow CrowPanel Advance 7.0-HMI (SKU DIS02170A)
;   ESP32-S3-WROOM-1-N16R8 (16 MB quad flash, 8 MB octal PSRAM), 800x480 IPS
;   on a 16-bit RGB parallel bus, GT911 capacitive touch, CH340K on UART0.
;   No native USB (GPIO19/20 are the microphone), so no CDC-on-boot.
;   Backlight and touch reset are NOT GPIOs: they are I2C commands to an
;   STC8H1K28 companion MCU at 0x30 (V1.2+).  V1.0 boards use a PCA9557
;   expander instead and are not supported.
;   The 320x240 CYD UI is rendered into a PSRAM sprite and pushed to the panel
;   at 2x (640x480, centred) — see src/crowpanel_adv7.cpp.
;   Board revision (silkscreen on the back) selects the backlight encoding:
;     -DCROWPANEL_ADVANCE_REV=130  V1.3 / V1.4 / V1.5 (current stock, default)
;     -DCROWPANEL_ADVANCE_REV=120  V1.2
;   Upload via: pio run -e crowpanel_adv7 --target upload
; ─────────────────────────────────────────────────────────────
[env:crowpanel_adv7]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.sdkconfig_path = sdkconfig.defaults.s3
; Replace the devkit's extra_flags wholesale: it assumes native USB (mode 1).
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM
upload_port = /dev/cu.wchusbserial*
upload_speed = 921600
lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  atsign/at_client@^1.0.0
  NoPorts
build_flags =
  ${env.build_flags}
  -DCROWPANEL_ADVANCE_7
  -DCROWPANEL_ADVANCE_REV=130
  ; Elecrow ship 16 MHz for V1.3+.  The framebuffer is scanned out of PSRAM,
  ; and WiFi/TLS bursts on the shared cache bus can starve that DMA for a
  ; frame (a single torn frame, self-healing at the next VSYNC).  14 MHz
  ; (~34 Hz refresh) gives the scan-out more slack; raise back to 16000000
  ; if you notice flicker instead.
  -DCROWPANEL_PCLK_HZ=14000000
