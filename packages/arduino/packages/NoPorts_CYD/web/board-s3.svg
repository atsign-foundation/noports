<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- PCB body (darker green differentiates from CYD) -->
  <rect x="1" y="1" width="158" height="118" rx="6" fill="#0d3b22" stroke="#1a6e30" stroke-width="1.5"/>
  <!-- Header strip top -->
  <rect x="14" y="2" width="132" height="5" rx="1" fill="#1a6e30"/>
  <!-- Header pins -->
  <rect x="16" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="22" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="28" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="34" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="40" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="116" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="122" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="128" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="134" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="140" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <!-- ESP32-S3-WROOM-1 module (top-left) -->
  <rect x="9" y="12" width="44" height="32" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="12" y="14" width="38" height="26" rx="1" fill="#111"/>
  <text x="31" y="25" font-family="monospace" font-size="5" fill="#666" text-anchor="middle">ESP32</text>
  <text x="31" y="33" font-family="monospace" font-size="5" fill="#666" text-anchor="middle">S3-WROOM</text>
  <!-- S3 badge (orange accent) -->
  <rect x="9" y="12" width="20" height="11" rx="2" fill="#d84315"/>
  <text x="19" y="21" font-family="sans-serif" font-size="7.5" fill="white" font-weight="bold" text-anchor="middle">S3</text>
  <!-- TFT bezel -->
  <rect x="57" y="10" width="101" height="100" rx="3" fill="#111"/>
  <!-- TFT screen -->
  <rect x="59" y="12" width="97" height="96" rx="2" fill="#0a192f"/>
  <!-- Screen top glare -->
  <rect x="59" y="12" width="97" height="18" rx="2" fill="rgba(255,255,255,0.04)"/>
  <!-- Screen content box -->
  <rect x="66" y="37" width="83" height="40" rx="4" fill="#0d2137" stroke="#1e3a5f" stroke-width="1"/>
  <!-- NoPorts brand on screen -->
  <text x="107" y="54" font-family="sans-serif" font-size="10" fill="#4fc3f7" text-anchor="middle" font-weight="bold">NoPorts</text>
  <text x="107" y="68" font-family="sans-serif" font-size="7" fill="#546e90" text-anchor="middle">S3 · Freenove</text>
  <!-- USB-C connector (bottom centre) -->
  <rect x="66" y="112" width="28" height="8" rx="3" fill="#9e9e9e"/>
  <rect x="68" y="114" width="24" height="4" rx="1.5" fill="#757575"/>
  <!-- Corner mounting holes -->
  <circle cx="7" cy="7" r="2.5" fill="#071e0f" stroke="#1a6e30" stroke-width="1"/>
  <circle cx="153" cy="7" r="2.5" fill="#071e0f" stroke="#1a6e30" stroke-width="1"/>
  <circle cx="7" cy="113" r="2.5" fill="#071e0f" stroke="#1a6e30" stroke-width="1"/>
  <circle cx="153" cy="113" r="2.5" fill="#071e0f" stroke="#1a6e30" stroke-width="1"/>
</svg>
