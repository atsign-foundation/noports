<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- PCB body -->
  <rect x="1" y="1" width="158" height="118" rx="6" fill="#1e5c2b" stroke="#2d7a3a" stroke-width="1.5"/>
  <!-- Header strip top -->
  <rect x="14" y="2" width="132" height="5" rx="1" fill="#2d7a3a"/>
  <!-- Header pins -->
  <rect x="16" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="22" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="28" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="34" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="40" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="116" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="122" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="128" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="134" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <rect x="140" y="1" width="3" height="7" rx="0.5" fill="#bdbdbd"/>
  <!-- TFT bezel -->
  <rect x="10" y="12" width="140" height="96" rx="3" fill="#111"/>
  <!-- TFT screen -->
  <rect x="12" y="14" width="136" height="92" rx="2" fill="#0a192f"/>
  <!-- Screen top glare -->
  <rect x="12" y="14" width="136" height="18" rx="2" fill="rgba(255,255,255,0.04)"/>
  <!-- Screen content box -->
  <rect x="36" y="38" width="88" height="38" rx="4" fill="#0d2137" stroke="#1e3a5f" stroke-width="1"/>
  <!-- NoPorts brand on screen -->
  <text x="80" y="54" font-family="sans-serif" font-size="10" fill="#4fc3f7" text-anchor="middle" font-weight="bold">NoPorts</text>
  <text x="80" y="68" font-family="sans-serif" font-size="7" fill="#546e90" text-anchor="middle">CYD · ESP32</text>
  <!-- USB-C (top) -->
  <rect x="66" y="0" width="28" height="8" rx="3" fill="#9e9e9e"/>
  <rect x="68" y="2" width="24" height="4" rx="1.5" fill="#757575"/>
  <!-- micro-USB (bottom) -->
  <rect x="68" y="112" width="24" height="8" rx="2" fill="#757575"/>
  <rect x="70" y="114" width="20" height="4" rx="1" fill="#616161"/>
  <!-- SD card slot -->
  <rect x="153" y="40" width="8" height="14" rx="1" fill="#bdbdbd"/>
  <rect x="154" y="42" width="6" height="10" rx="0.5" fill="#e0e0e0"/>
  <!-- Corner mounting holes -->
  <circle cx="7" cy="7" r="2.5" fill="#0f3d18" stroke="#2d7a3a" stroke-width="1"/>
  <circle cx="153" cy="7" r="2.5" fill="#0f3d18" stroke="#2d7a3a" stroke-width="1"/>
  <circle cx="7" cy="113" r="2.5" fill="#0f3d18" stroke="#2d7a3a" stroke-width="1"/>
  <circle cx="153" cy="113" r="2.5" fill="#0f3d18" stroke="#2d7a3a" stroke-width="1"/>
</svg>
