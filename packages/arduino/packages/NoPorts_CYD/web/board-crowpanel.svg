<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Elecrow CrowPanel Advance 7.0: wide 800x480 IPS panel, ESP32-S3 on the back -->
  <!-- Enclosure / bezel -->
  <rect x="1" y="16" width="158" height="88" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- 7" screen (5:3) -->
  <rect x="9" y="22" width="142" height="76" rx="2" fill="#0a192f"/>
  <!-- Screen top glare -->
  <rect x="9" y="22" width="142" height="14" rx="2" fill="rgba(255,255,255,0.04)"/>
  <!-- Screen content box -->
  <rect x="34" y="38" width="92" height="42" rx="4" fill="#0d2137" stroke="#1e3a5f" stroke-width="1"/>
  <!-- NoPorts brand on screen -->
  <text x="80" y="56" font-family="sans-serif" font-size="11" fill="#4fc3f7" text-anchor="middle" font-weight="bold">NoPorts</text>
  <text x="80" y="70" font-family="sans-serif" font-size="7" fill="#546e90" text-anchor="middle">7" · 800×480</text>
  <!-- S3 badge (orange accent, matches the S3 card) -->
  <rect x="9" y="3" width="20" height="11" rx="2" fill="#d84315"/>
  <text x="19" y="12" font-family="sans-serif" font-size="7.5" fill="white" font-weight="bold" text-anchor="middle">S3</text>
  <text x="33" y="12" font-family="monospace" font-size="6" fill="#888">ESP32-S3 · Elecrow</text>
  <!-- USB-C connector (bottom centre) -->
  <rect x="66" y="106" width="28" height="8" rx="3" fill="#9e9e9e"/>
  <rect x="68" y="108" width="24" height="4" rx="1.5" fill="#757575"/>
  <!-- Corner mounting holes -->
  <circle cx="6" cy="21" r="2" fill="#000" stroke="#333" stroke-width="1"/>
  <circle cx="154" cy="21" r="2" fill="#000" stroke="#333" stroke-width="1"/>
  <circle cx="6" cy="99" r="2" fill="#000" stroke="#333" stroke-width="1"/>
  <circle cx="154" cy="99" r="2" fill="#000" stroke="#333" stroke-width="1"/>
</svg>
