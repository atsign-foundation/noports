server {
    listen 80;
    root   /usr/share/nginx/html;
    index  index.html;

    # Enable gzip for text assets; .bin files are already compressed
    gzip            on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # Firmware binaries – serve as octet-stream with CORS so ESP Web Tools
    # (running in the same browser page) can fetch and pass to WebSerial.
    location ~* \.bin$ {
        add_header Content-Type              application/octet-stream;
        add_header Content-Disposition       "attachment";
        add_header Access-Control-Allow-Origin  "*";
        add_header Cache-Control             "no-cache";
    }

    # JSON manifests consumed by ESP Web Tools
    location ~* \.json$ {
        add_header Content-Type             application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control            "no-cache";
    }

    # Everything else (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
