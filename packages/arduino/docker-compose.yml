# NoPorts firmware flasher — all variants
#
#   docker compose up --build
#
# Then browse to http://localhost:8081
#
# The router port is bound to 127.0.0.1 only, so the flasher is reachable from
# this machine but NOT the local network. WebSerial flashing needs a secure
# context, which localhost satisfies. To expose it on the network, change the
# bind below AND put it behind HTTPS (a plain-HTTP flasher on the LAN is unsafe).
#
# The router nginx serves a landing page and proxies:
#   /cyd/  →  NoPorts CYD (ESP32 / ESP32-S3 display variants)
#   /poe/  →  NoPorts PoE (ESP32-P4 headless Ethernet variant)

services:

  cyd-flasher:
    build:
      context: .
      dockerfile: packages/NoPorts_CYD/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  poe-flasher:
    build:
      context: .
      dockerfile: packages/NoPorts_PoE/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  router:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - cyd-flasher
      - poe-flasher
    restart: unless-stopped
